name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Verify tag matches the declared version
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(uv version --short)"
          if [ "${tag}" != "${version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - name: Guard built version matches tag
        run: |
          tag="${RELEASE_TAG#v}"
          wheel=$(ls dist/aioengiebelgium-*.whl | head -1)
          built=$(basename "$wheel" | sed -E 's/^aioengiebelgium-([^-]+)-.*/\1/')
          echo "tag=$tag built=$built"
          test "$tag" = "$built"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Trusted Publishing: the `aioengiebelgium` project on PyPI must be
      # configured (once, manually) to trust this repo + workflow + environment.
      # skip-existing: an accidental re-tag of a published version no-ops
      # instead of failing the job on PyPI's duplicate-file rejection.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
