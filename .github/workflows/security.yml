name: Security

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SHA-pinned: setup-uv has no moving @v8 tag (dropped as of v8.0.0);
      # Dependabot bumps the SHA via the trailing version comment.
      # No version input: setup-uv reads [tool.uv] required-version from
      # pyproject.toml, which pins the uv CLI to the uv_build compatibility range.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Static analysis does not change without code changes, so the weekly
      # sweep only re-runs the dependency vulnerability audit.
      - name: Bandit
        if: github.event_name != 'schedule'
        run: uvx bandit -r src/ scripts/ -ll

      # Audits the runtime dependency set the wheel ships. The dev-only
      # diagnostics chain cannot be included: aioesphomeapi caps
      # cryptography below 49 for darwin x86_64, which conflicts with the
      # fixes for its current advisories.
      - name: pip-audit
        run: >
          uv export --locked --no-dev --format requirements-txt
          --no-emit-project --no-hashes
          | uvx pip-audit --requirement /dev/stdin
