name: Bug report
description: Report something that is not working as expected
labels: [bugfix]
body:
  - type: markdown
    attributes:
      value: |
        Never paste noise PSKs, proxy passwords, or unredacted capture
        files into this report. Redact addresses, identifiers, device IDs,
        product keys, pack serials, and credentials before sharing any log
        or payload.
  - type: input
    id: package-version
    attributes:
      label: solarflow-ble version
      description: The version you have installed.
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: 3.14.0
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device model
      description: The SolarFlow model you are talking to.
      placeholder: e.g. SolarFlow 2400AC
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware and app version
      description: The device firmware version and the Zendure app version, if known.
      placeholder: e.g. firmware 1.0.30, app 7.0.0
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: How the library reaches the device.
      options:
        - Native BLE (BleakTransport)
        - ESPHome Bluetooth proxy
        - Other or custom BleTransport
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The smallest self-contained code snippet that triggers the bug,
        plus the traceback if there is one. Redact all credentials first.
      placeholder: |
        import asyncio

        from bleak.backends.device import BLEDevice

        from solarflow_ble import BleakTransport, SolarFlowClient

        ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: |
        Debug logs or a redacted capture. Addresses, identifiers, device
        IDs, product keys, pack serials, and credentials must be redacted.
    validations:
      required: false
